name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See android/README.md." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --password="$ANDROID_KEYSTORE_PASSWORD" \
            --keyPassword="$ANDROID_KEY_PASSWORD"

      - name: Locate build output
        id: find_apk
        run: |
          APK_PATH="$(find . -maxdepth 3 -iname '*.apk' | head -n1 | sed 's|^\./||')"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No .apk found after build" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" FoodGuardAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-guard-ai-android
          path: android/${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # Bubblewrap's build also produces a signed .aab alongside the .apk
      # (same signing key, same version) — that's the format Google Play
      # requires for the Play Console listing. The .apk above stays the
      # public sideload/GitHub-Release download; the .aab is upload-only
      # so it's kept as a private workflow artifact for whoever manages
      # the Play Console listing to download and upload there.
      - name: Locate build output (AAB)
        id: find_aab
        run: |
          AAB_PATH="$(find . -maxdepth 3 -iname '*.aab' | head -n1 | sed 's|^\./||')"
          if [ -z "$AAB_PATH" ]; then
            echo "::warning::No .aab found after build — Bubblewrap version may differ; Play Store upload will need one built manually (bubblewrap build produces it by default)." >&2
          else
            echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
            cp "$AAB_PATH" FoodGuardAI.aab
          fi

      - name: Upload AAB artifact (for Play Console upload)
        if: steps.find_aab.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: food-guard-ai-android-bundle
          path: android/FoodGuardAI.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: FoodGuard AI Android build ${{ github.run_number }}
          make_latest: true
          files: android/FoodGuardAI.apk
          body: |
            Automated Android build from commit ${{ github.sha }}.

            Always download the current version from the stable link:
            https://github.com/${{ github.repository }}/releases/latest/download/FoodGuardAI.apk

      - name: Clean up keystore from workspace
        if: always()
        run: rm -f android.keystore
