name: food-guard-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Explicit public resolvers for every container. Docker is supposed to swap
# in its own embedded DNS (127.0.0.11) when the host's /etc/resolv.conf
# points at a loopback stub resolver (e.g. systemd-resolved's 127.0.0.53 on
# Ubuntu), but that detection doesn't always kick in — when it doesn't,
# containers inherit 127.0.0.53 verbatim, which isn't reachable from inside
# a container's own network namespace, and every outbound DNS lookup (image
# pulls from inside a container, Ollama model pulls, SMTP, webhooks) fails
# with "connection refused". Pinning real resolvers here sidesteps that
# entirely rather than depending on host-level detection working correctly.
x-dns: &default-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodguard-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-foodguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only reachable from other containers on this
    # compose network (as "db:5432"). Avoids clashing with any other Postgres
    # already running on the host, and keeps the database off the public internet.

  api:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-1.0}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://foodguard:foodguard-dev-password@db:5432/foodguard}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"   # loopback only; public access goes through nginx
    volumes:
      - api-uploads:/data/uploads
    # No command override: backend/Dockerfile's own CMD already runs
    # migrations then starts uvicorn with these same flags, reading
    # API_WORKERS from the environment above.

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"   # loopback only; public access goes through nginx

  # Only used by deploy/install.sh (fresh servers with no reverse proxy of
  # their own). On a host that already runs its own nginx/Apache in front of
  # other sites, use deploy/install-vhost.sh instead, which adds a vhost to
  # the existing web server and never starts this service — see docs/INSTALL.md.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    cpus: ${OLLAMA_CPU_LIMIT:-2.0}
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # loopback only; the api container reaches it via the compose network

volumes:
  pgdata:
  api-uploads:
  ollama:
  certbot-webroot:
  certbot-etc:
